<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Визитка</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Визитка для гостей (плейсхолдер). Аватарка открывает окно входа -->
  <section id="visitCard" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-5 shadow-2xl">
      <button data-action="onAvatarClick" aria-label="Войти" class="mx-auto w-24 h-24 rounded-full bg-slate-800 border-2 border-purple-600/60 hover:border-purple-400 flex items-center justify-center text-4xl transition">👤</button>
      <div class="space-y-1">
        <h1 class="text-xl font-bold text-purple-400">Здесь будет визитка</h1>
        <p class="text-sm text-slate-500">Плейсхолдер: имя, описание и контакты появятся позже.</p>
      </div>
    </div>
  </section>

  <!-- Окно входа (только для автора сайта) -->
  <div id="loginModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50" data-action="closeLoginModalOnBackdrop">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-purple-400">Вход</h3>
        <button data-action="closeLoginModal" aria-label="Закрыть" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <p id="loginModalMessage" class="hidden text-sm text-red-400"></p>
      <p class="text-sm text-slate-400">Это окно нужно только для автора сайта, вы можете ничего не нажимать тут.</p>
      <div id="telegramLoginButton" class="flex justify-center min-h-[40px] pt-2"></div>
    </div>
  </div>

  <script type="module" src="../js/pages/visit.js"></script>
</body>
</html>
