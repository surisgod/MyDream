<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Дневник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/markdown.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">

  <!-- Статус загрузки / ошибки авторизации -->
  <div id="appLoader" class="text-center py-24 space-y-4">
    <p id="appLoaderText" class="text-slate-500">Загрузка…</p>
    <a id="appLoaderBack" href="../visit/" class="hidden inline-block text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-4 py-2 rounded-xl transition">На визитку</a>
  </div>

  <!-- Дневник: скрыт, пока человек не авторизован -->
  <div id="appRoot" class="hidden">


  <!-- Липкая шапка -->
  <header id="mainHeader" class="fixed top-0 inset-x-0 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 z-30 py-4">
    <div class="max-w-3xl mx-auto px-4 space-y-3">
      
      <!-- ЭТА ЧАСТЬ БУДЕТ ПРЯТАТЬСЯ (Заголовок + Переключатель вкладок) -->
      <div id="headerTop" class="space-y-3">
        <div class="flex justify-between items-center">
          <h1 class="text-xl font-bold text-purple-400">📖 Мой дневник</h1>
          <div class="flex items-center space-x-3">
            <span id="userInfo" class="text-xs text-slate-400"></span>
            <button data-action="openCreateModal" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-medium px-3 py-1.5 rounded-xl transition flex items-center space-x-1 shadow-lg">
              <span>+ Новая запись</span>
            </button>
          </div>
        </div>

        <!-- Служебные кнопки -->
        <div class="flex justify-between items-center">
          <a href="../visit/" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-xl transition">← Выйти на визитку</a>
          <a href="settings/" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-xl transition">⚙️ Настройки</a>
        </div>

        <!-- Переключатель вкладок: Лента / Календарь уходит наверх -->
        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
          <button id="tabFeedBtn" data-action="switchTab" data-tab="feed" class="flex-1 py-1.5 text-xs font-medium rounded-lg bg-purple-600 text-white transition">Лента записей</button>
          <button id="tabCalBtn" data-action="switchTab" data-tab="calendar" class="flex-1 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">Календарь и Статистика</button>
        </div>
      </div>

      <!-- ЭТА ЧАСТЬ ВСЕГДА ОСТАЕТСЯ НА ЭКРАНЕ (Поиск и Теги) -->
      <div id="headerStickyBottom" class="space-y-3 pt-1">
        <!-- Поиск -->
        <div id="searchWrapper" class="flex gap-2">
          <input type="text" id="searchInput" placeholder="Поиск по тексту, числу, месяцу или году..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
        </div>

        <!-- Панель тегов -->
        <div id="tagsContainer" class="flex gap-2 overflow-x-auto custom-scrollbar pb-1 text-xs">
          <button data-action="filterByTag" class="tag-btn bg-purple-600 text-white px-3 py-1 rounded-full shrink-0 font-medium transition">Все</button>
        </div>
      </div>

    </div>
  </header>
  <!-- Распорка: держит место под фиксированной шапкой -->
  <div id="headerSpacer"></div>

  <div class="max-w-3xl mx-auto px-4 py-6">
    <!-- Вкладка 1: Лента -->
    <main id="notesContainer" class="space-y-4">
      <p class="text-slate-500 text-center py-10">Загрузка записей...</p>
    </main>

    <!-- Вкладка 2: Календарь и Статистика -->
    <div id="calendarContainer" class="hidden space-y-6">
      <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 max-w-xs mx-auto">
        <button id="subTabCalBtn" data-action="switchCalSubTab" data-tab="calendar" class="flex-1 py-1 text-xs font-medium rounded-lg bg-purple-600 text-white transition">Календарь</button>
        <button id="subTabStatBtn" data-action="switchCalSubTab" data-tab="stats" class="flex-1 py-1 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">Статистика слов</button>
      </div>

      <!-- Блок календаря -->
      <div id="calendarViewBlock" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center space-x-3">
            <h3 id="calMonthTitle" class="font-bold text-purple-400 text-base">Месяц Год</h3>
            <button data-action="resetCalendarToCurrent" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-purple-300 px-2.5 py-1 rounded-lg transition border border-slate-700">Сегодня</button>
          </div>
          <div class="space-x-1">
            <button data-action="changeMonth" data-dir="-1" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg transition">←</button>
            <button data-action="changeMonth" data-dir="1" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg transition">→</button>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 font-medium mb-2">
          <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div id="calGrid" class="grid grid-cols-7 gap-1.5"></div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
          <span class="text-slate-400">Слов за этот месяц: <span id="calMonthWords" class="font-bold text-purple-400">0</span></span>
          <span class="text-[10px] text-slate-600">число под днём — слов за день</span>
        </div>
      </div>

      <!-- Блок статистики -->
      <div id="statsViewBlock" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
        <h3 class="font-bold text-purple-400 text-base">📊 Статистика активности и слов</h3>
        <div id="statsContent" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
      </div>
    </div>
  </div>

  </div><!-- /appRoot -->

  <!-- Модальное окно редактирования / создания -->
  <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full max-h-full overflow-y-auto p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-purple-400">Редактирование заметки</h3>
        <button data-action="closeModal" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div class="flex items-center space-x-2">
        <span class="text-xs text-slate-400">Настроение (необязательно):</span>
        <div class="flex gap-1.5" id="emojiSelector">
          <button type="button" data-action="setEmoji" data-emoji="😊" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">😊</button>
          <button type="button" data-action="setEmoji" data-emoji="🔥" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">🔥</button>
          <button type="button" data-action="setEmoji" data-emoji="💡" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">💡</button>
          <button type="button" data-action="setEmoji" data-emoji="🌧️" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">🌧️</button>
          <button type="button" data-action="setEmoji" data-emoji="❤️" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">❤️</button>
          <button type="button" data-action="setEmoji" data-emoji="🎯" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">🎯</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1 bg-slate-950 border border-slate-800 p-1.5 rounded-xl text-slate-300">
        <button data-action="insertMarkdown" data-start="**" data-end="**" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs font-bold rounded transition" title="Жирный">B</button>
        <button data-action="insertMarkdown" data-start="*" data-end="*" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs italic rounded transition" title="Курсив">I</button>
        <button data-action="insertMarkdown" data-start="&lt;u&gt;" data-end="&lt;/u&gt;" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs underline rounded transition" title="Подчеркнутый">U</button>
        <button data-action="insertMarkdown" data-start="~~" data-end="~~" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs line-through rounded transition" title="Зачеркнутый">S</button>
        <span class="text-slate-700 mx-1">|</span>
        <button data-action="insertMarkdown" data-start="&gt; " data-end="" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs rounded transition" title="Цитата">“ ”</button>
        <button data-action="insertMarkdown" data-start="`" data-end="`" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs font-mono rounded transition" title="Код">&lt;/&gt;</button>
        <button data-action="insertMarkdown" data-start="### " data-end="" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs font-semibold rounded transition" title="Заголовок">H3</button>
        <button data-action="insertMarkdown" data-start="- " data-end="" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs rounded transition" title="Список">• Список</button>
      </div>

      <div class="space-y-2">
        <div id="modalImageContainer"></div>
        <div class="flex items-center space-x-2">
          <label id="photoLabel" class="cursor-pointer shrink-0 bg-slate-950 border border-slate-800 hover:border-purple-500 text-xs text-slate-300 px-3 py-1.5 rounded-xl transition flex items-center space-x-1.5">
            <span>📷 Прикрепить фото</span>
            <input type="file" id="photoFileInput" accept="image/*" multiple class="hidden">
          </label>
          <span id="photoInfo" class="text-[10px] text-slate-500"></span>
        </div>
      </div>

      <div class="relative">
        <textarea id="modalText" rows="6" placeholder="Введите текст заметки..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500 custom-scrollbar"></textarea>
        <div id="charCount" class="absolute bottom-3 right-3 text-[10px] text-slate-500 bg-slate-900/80 px-2 py-0.5 rounded">0 симв. / 0 слов</div>
      </div>

      <div class="flex justify-between items-center">
        <button id="deleteBtn" data-action="deleteCurrentNote" class="px-4 py-2 bg-red-950/40 text-red-400 border border-red-900/50 rounded-xl text-xs hover:bg-red-900/40">Удалить</button>
        <div class="space-x-2">
          <button data-action="closeModal" class="px-4 py-2 bg-slate-800 text-xs rounded-xl hover:bg-slate-700">Отмена</button>
          <button data-action="saveCurrentNote" class="px-4 py-2 bg-purple-600 text-xs rounded-xl hover:bg-purple-500 font-medium">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Просмотр фото на весь экран (листание слева направо) -->
  <div id="imageModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50" data-action="closeImageModalOnBackdrop">
    <span id="viewerCounter" class="hidden absolute top-4 left-4 z-10 text-xs text-white bg-black/60 px-2.5 py-1 rounded-full"></span>
    <button data-action="closeImageModal" class="absolute top-4 right-4 z-10 text-white text-xl bg-slate-800/80 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
    <div id="viewerScroller" class="flex h-full w-full overflow-x-auto snap-x snap-mandatory no-scrollbar"></div>
  </div>

  <script type="module" src="../js/pages/notes.js"></script>
</body>
</html>
