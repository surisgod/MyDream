<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Личный Дневник</title>
  <!-- Подключаем Tailwind CSS для красивой и адаптивной верстки -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">

  <!-- Контейнер страницы -->
  <div class="max-w-3xl mx-auto px-4 py-8 md:py-12">
    
    <!-- Шапка -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-indigo-400 tracking-tight">📖 Dream Journal</h1>
        <p class="text-slate-400 text-sm mt-1">Thoughts, notes and moments</p>
      </div>
      <!-- Поиск -->
      <input type="text" id="searchInput" placeholder="Поиск по записям..." 
             class="w-full sm:w-64 px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm transition">
    </header>

    <!-- Лента записей (сюда JS будет подгружать данные из базы) -->
    <main id="notesContainer" class="space-y-6">
      
      <!-- Пример карточки (потом удалим, когда подключим базу) -->
      <article class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 md:p-6 shadow-sm">
        <div class="flex justify-between items-center text-xs text-slate-500 mb-3">
          <span>📅 4 ноября 2026, 14:32</span>
        </div>
        <p class="text-slate-200 text-sm md:text-base leading-relaxed whitespace-pre-line">
          Привет! Это тестовая запись. Скоро здесь появится твоя реальная база данных из Supabase и Telegram-бот! ✨
        </p>
      </article>

    </main>

  </div>

</body>
</html>
