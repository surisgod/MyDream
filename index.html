<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Дневник</title>
</head>
<body style="background:#020617">
  <!-- Главный адрес сайта: вошедших ведёт в дневник, остальных — на визитку.
       Ключ совпадает с AUTH_STORAGE_KEY в js/config.js; настоящая проверка входа — на странице дневника -->
  <script>
    var saved = null;
    try { saved = localStorage.getItem('mydream:auth'); } catch (e) {}
    location.replace(saved ? 'notes/' : 'visit/');
  </script>
  <noscript><a href="visit/">Перейти на сайт</a></noscript>
</body>
</html>
