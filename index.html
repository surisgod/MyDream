<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Дневник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Шапка фиксирована и прячется через transform — высота страницы не меняется */
    #mainHeader {
      transition: transform 0.25s ease;
      will-change: transform;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    .custom-scrollbar::-webkit-scrollbar { height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.4); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.8); }

    /* Тонкий скролл для текстового поля */
    #modalText::-webkit-scrollbar { width: 4px; }
    #modalText::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 4px; }
    #modalText::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.4); border-radius: 4px; }
    #modalText::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.8); }

    .markdown-body h3 { font-size: 1.1rem; font-weight: bold; color: #c084fc; margin-top: 0.5rem; margin-bottom: 0.25rem; }
    .markdown-body p { margin-bottom: 0.5rem; line-height: 1.5; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body blockquote { border-left: 3px solid #a855f7; padding-left: 0.75rem; color: #94a3b8; font-style: italic; margin-bottom: 0.5rem; }
    .markdown-body code { background-color: #0f172a; padding: 0.15rem 0.3rem; border-radius: 0.25rem; font-size: 0.85em; font-family: monospace; color: #e2e8f0; }
    .markdown-body strong { font-weight: bold; color: #f8fafc; }
    .markdown-body em { font-style: italic; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">

  <!-- Липкая шапка -->
  <header id="mainHeader" class="fixed top-0 inset-x-0 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 z-30 py-4">
    <div class="max-w-3xl mx-auto px-4 space-y-3">
      
      <!-- ЭТА ЧАСТЬ БУДЕТ ПРЯТАТЬСЯ (Заголовок + Переключатель вкладок) -->
      <div id="headerTop" class="space-y-3">
        <div class="flex justify-between items-center">
          <h1 class="text-xl font-bold text-purple-400">📖 Мой дневник</h1>
          <div class="flex items-center space-x-3">
            <span id="userInfo" class="text-xs text-slate-400"></span>
            <button onclick="openCreateModal()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-medium px-3 py-1.5 rounded-xl transition flex items-center space-x-1 shadow-lg">
              <span>+ Новая запись</span>
            </button>
          </div>
        </div>

        <!-- Переключатель вкладок: Лента / Календарь уходит наверх -->
        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
          <button id="tabFeedBtn" onclick="switchTab('feed')" class="flex-1 py-1.5 text-xs font-medium rounded-lg bg-purple-600 text-white transition">Лента записей</button>
          <button id="tabCalBtn" onclick="switchTab('calendar')" class="flex-1 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">Календарь и Статистика</button>
        </div>
      </div>

      <!-- ЭТА ЧАСТЬ ВСЕГДА ОСТАЕТСЯ НА ЭКРАНЕ (Поиск и Теги) -->
      <div id="headerStickyBottom" class="space-y-3 pt-1">
        <!-- Поиск -->
        <div id="searchWrapper" class="flex gap-2">
          <input type="text" id="searchInput" placeholder="Поиск по тексту, числу, месяцу или году..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-purple-500">
        </div>

        <!-- Панель тегов -->
        <div id="tagsContainer" class="flex gap-2 overflow-x-auto custom-scrollbar pb-1 text-xs">
          <button onclick="filterByTag(null)" class="tag-btn bg-purple-600 text-white px-3 py-1 rounded-full shrink-0 font-medium transition">Все</button>
        </div>
      </div>

    </div>
  </header>
  <!-- Распорка: держит место под фиксированной шапкой -->
  <div id="headerSpacer"></div>

  <div class="max-w-3xl mx-auto px-4 py-6">
    <!-- Вкладка 1: Лента -->
    <main id="notesContainer" class="space-y-4">
      <p class="text-slate-500 text-center py-10">Загрузка записей...</p>
    </main>

    <!-- Вкладка 2: Календарь и Статистика -->
    <div id="calendarContainer" class="hidden space-y-6">
      <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 max-w-xs mx-auto">
        <button id="subTabCalBtn" onclick="switchCalSubTab('calendar')" class="flex-1 py-1 text-xs font-medium rounded-lg bg-purple-600 text-white transition">Календарь</button>
        <button id="subTabStatBtn" onclick="switchCalSubTab('stats')" class="flex-1 py-1 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">Статистика слов</button>
      </div>

      <!-- Блок календаря -->
      <div id="calendarViewBlock" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center space-x-3">
            <h3 id="calMonthTitle" class="font-bold text-purple-400 text-base">Месяц Год</h3>
            <button onclick="resetCalendarToCurrent()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-purple-300 px-2.5 py-1 rounded-lg transition border border-slate-700">Сегодня</button>
          </div>
          <div class="space-x-1">
            <button onclick="changeMonth(-1)" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg transition">←</button>
            <button onclick="changeMonth(1)" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg transition">→</button>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 font-medium mb-2">
          <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div id="calGrid" class="grid grid-cols-7 gap-1.5"></div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
          <span class="text-slate-400">Слов за этот месяц: <span id="calMonthWords" class="font-bold text-purple-400">0</span></span>
          <span class="text-[10px] text-slate-600">число под днём — слов за день</span>
        </div>
      </div>

      <!-- Блок статистики -->
      <div id="statsViewBlock" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
        <h3 class="font-bold text-purple-400 text-base">📊 Статистика активности и слов</h3>
        <div id="statsContent" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
      </div>
    </div>
  </div>

  <!-- Модальное окно редактирования / создания -->
  <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full max-h-full overflow-y-auto p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-purple-400">Редактирование заметки</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div class="flex items-center space-x-2">
        <span class="text-xs text-slate-400">Настроение (необязательно):</span>
        <div class="flex gap-1.5" id="emojiSelector">
          <button type="button" onclick="setEmoji('😊')" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">😊</button>
          <button type="button" onclick="setEmoji('🔥')" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">🔥</button>
          <button type="button" onclick="setEmoji('💡')" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">💡</button>
          <button type="button" onclick="setEmoji('🌧️')" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">🌧️</button>
          <button type="button" onclick="setEmoji('❤️')" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">❤️</button>
          <button type="button" onclick="setEmoji('🎯')" class="emoji-option p-1.5 rounded-lg bg-slate-950 hover:bg-slate-800 text-base transition">🎯</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-1 bg-slate-950 border border-slate-800 p-1.5 rounded-xl text-slate-300">
        <button onclick="insertMarkdown('**', '**')" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs font-bold rounded transition" title="Жирный">B</button>
        <button onclick="insertMarkdown('*', '*')" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs italic rounded transition" title="Курсив">I</button>
        <button onclick="insertMarkdown('<u>', '</u>')" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs underline rounded transition" title="Подчеркнутый">U</button>
        <button onclick="insertMarkdown('~~', '~~')" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs line-through rounded transition" title="Зачеркнутый">S</button>
        <span class="text-slate-700 mx-1">|</span>
        <button onclick="insertMarkdown('> ', '')" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs rounded transition" title="Цитата">“ ”</button>
        <button onclick="insertMarkdown('`', '`')" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs font-mono rounded transition" title="Код">&lt;/&gt;</button>
        <button onclick="insertMarkdown('### ', '')" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs font-semibold rounded transition" title="Заголовок">H3</button>
        <button onclick="insertMarkdown('- ', '')" class="px-2 py-1 bg-slate-900 hover:bg-slate-800 text-xs rounded transition" title="Список">• Список</button>
      </div>

      <div class="space-y-2">
        <div id="modalImageContainer"></div>
        <div class="flex items-center space-x-2">
          <label id="photoLabel" class="cursor-pointer shrink-0 bg-slate-950 border border-slate-800 hover:border-purple-500 text-xs text-slate-300 px-3 py-1.5 rounded-xl transition flex items-center space-x-1.5">
            <span>📷 Прикрепить фото</span>
            <input type="file" id="photoFileInput" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)">
          </label>
          <span id="photoInfo" class="text-[10px] text-slate-500"></span>
        </div>
      </div>

      <div class="relative">
        <textarea id="modalText" rows="6" placeholder="Введите текст заметки..." oninput="handleTextDraftInput()" onpaste="handlePaste(event)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500 custom-scrollbar"></textarea>
        <div id="charCount" class="absolute bottom-3 right-3 text-[10px] text-slate-500 bg-slate-900/80 px-2 py-0.5 rounded">0 симв. / 0 слов</div>
      </div>

      <div class="flex justify-between items-center">
        <button id="deleteBtn" onclick="deleteCurrentNote()" class="px-4 py-2 bg-red-950/40 text-red-400 border border-red-900/50 rounded-xl text-xs hover:bg-red-900/40">Удалить</button>
        <div class="space-x-2">
          <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-xs rounded-xl hover:bg-slate-700">Отмена</button>
          <button onclick="saveCurrentNote()" class="px-4 py-2 bg-purple-600 text-xs rounded-xl hover:bg-purple-500 font-medium">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Просмотр фото на весь экран (листание слева направо) -->
  <div id="imageModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50" onclick="if (event.target === this) closeImageModal()">
    <span id="viewerCounter" class="hidden absolute top-4 left-4 z-10 text-xs text-white bg-black/60 px-2.5 py-1 rounded-full"></span>
    <button onclick="closeImageModal()" class="absolute top-4 right-4 z-10 text-white text-xl bg-slate-800/80 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
    <div id="viewerScroller" class="flex h-full w-full overflow-x-auto snap-x snap-mandatory no-scrollbar" onscroll="onViewerScroll()"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://oblwxfefeltikdkmodon.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bhvGHwhyHMBsG7amxcEw0g_fkWowvv6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MY_TELEGRAM_ID = 8499249541; 
    const BOT_USERNAME = 'OmoriDiarybot';

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let allNotes = [];
    let currentEditingId = null;
    let selectedTag = null;
    let searchQuery = '';
    let openDays = {};
    let currentTab = 'feed';
    let currentCalSubTab = 'calendar';
    let selectedEmoji = null; // по умолчанию без эмодзи
    let currentPhotos = [];   // [{url, size}] — фото редактируемой записи
    let isUploading = false;

    const MAX_PHOTOS = 4;
    const MAX_TOTAL_BYTES = 40 * 1024 * 1024; // 40 МБ на запись
    const FAV_TAG = '__fav__';
    
    let calCurrentDate = new Date();

    const tgUser = tg.initDataUnsafe?.user;
    if (tgUser && tgUser.id) {
      if (window.location.search || window.location.hash.includes('tgWebAppData')) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      initApp(tgUser);
    } else {
      const savedUser = JSON.parse(localStorage.getItem('tg_user') || 'null');
      if (savedUser) {
        initApp(savedUser);
      } else {
        renderLoginScreen();
      }
    }

    function renderLoginScreen() {
      document.querySelector('header').style.display = 'none';
      document.getElementById('notesContainer').innerHTML = `
        <div class="text-center py-16 space-y-4">
          <h2 class="text-lg font-medium text-slate-300">Авторизуйтесь для доступа к дневнику</h2>
          <div id="telegramLoginButton" class="flex justify-center pt-2"></div>
        </div>
      `;
      const script = document.createElement('script');
      script.async = true;
      script.src = "https://telegram.org/js/telegram-widget.js?22";
      script.setAttribute('data-telegram-login', BOT_USERNAME);
      script.setAttribute('data-size', 'large');
      script.setAttribute('data-onauth', 'onTelegramAuth(user)');
      document.getElementById('telegramLoginButton').appendChild(script);
    }

    window.onTelegramAuth = function(user) {
      localStorage.setItem('tg_user', JSON.stringify(user));
      location.reload();
    };

    async function initApp(user) {
      if (user.id !== MY_TELEGRAM_ID) {
        document.querySelector('header').style.display = 'none';
        document.getElementById('notesContainer').innerHTML = `<p class="text-red-400 text-center py-10">⛔ Доступ запрещен</p>`;
        return;
      }

      document.getElementById('userInfo').innerHTML = `👤 ${user.first_name || 'Владелец'}`;
      await fetchNotes();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        if (searchQuery) {
          Object.keys(openDays).forEach(d => openDays[d] = true);
        }
        renderNotes();
      });

      document.getElementById('modalText').addEventListener('input', updateCounters);
    }

    function switchTab(tab) {
      currentTab = tab;
      const feedBtn = document.getElementById('tabFeedBtn');
      const calBtn = document.getElementById('tabCalBtn');
      const notesContainer = document.getElementById('notesContainer');
      const calendarContainer = document.getElementById('calendarContainer');
      const searchWrapper = document.getElementById('searchWrapper');
      const tagsContainer = document.getElementById('tagsContainer');

      if (tab === 'feed') {
        feedBtn.className = "flex-1 py-1.5 text-xs font-medium rounded-lg bg-purple-600 text-white transition";
        calBtn.className = "flex-1 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition";
        notesContainer.classList.remove('hidden');
        searchWrapper.classList.remove('hidden');
        tagsContainer.classList.remove('hidden');
        calendarContainer.classList.add('hidden');
        renderNotes();
      } else {
        calBtn.className = "flex-1 py-1.5 text-xs font-medium rounded-lg bg-purple-600 text-white transition";
        feedBtn.className = "flex-1 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition";
        notesContainer.classList.add('hidden');
        searchWrapper.classList.add('hidden');
        tagsContainer.classList.add('hidden');
        calendarContainer.classList.remove('hidden');
        resetCalendarToCurrent();
      }
    }

    function switchCalSubTab(subTab) {
      currentCalSubTab = subTab;
      const subTabCalBtn = document.getElementById('subTabCalBtn');
      const subTabStatBtn = document.getElementById('subTabStatBtn');
      const calendarViewBlock = document.getElementById('calendarViewBlock');
      const statsViewBlock = document.getElementById('statsViewBlock');

      if (subTab === 'calendar') {
        subTabCalBtn.className = "flex-1 py-1 text-xs font-medium rounded-lg bg-purple-600 text-white transition";
        subTabStatBtn.className = "flex-1 py-1 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition";
        calendarViewBlock.classList.remove('hidden');
        statsViewBlock.classList.add('hidden');
        renderCalendar();
      } else {
        subTabStatBtn.className = "flex-1 py-1 text-xs font-medium rounded-lg bg-purple-600 text-white transition";
        subTabCalBtn.className = "flex-1 py-1 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition";
        calendarViewBlock.classList.add('hidden');
        statsViewBlock.classList.remove('hidden');
        renderStats();
      }
    }

    function resetCalendarToCurrent() {
      calCurrentDate = new Date();
      renderCalendar();
    }

    async function fetchNotes() {
      const { data, error } = await supabaseClient
        .from('notes')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }
      allNotes = data || [];
      
      const groups = groupByDate(allNotes);
      Object.keys(groups).forEach(date => {
        if (openDays[date] === undefined) {
          openDays[date] = false; 
        }
      });

      renderTags();
      if (currentTab === 'feed') renderNotes();
      else if (currentCalSubTab === 'calendar') renderCalendar();
      else renderStats();
    }

    function groupByDate(notesList) {
      const groups = {};
      notesList.forEach(note => {
        const dateStr = new Date(note.created_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        if (!groups[dateStr]) groups[dateStr] = [];
        groups[dateStr].push(note);
      });
      return groups;
    }

    function getAllTags() {
      const tagsSet = new Set();
      allNotes.forEach(note => {
        const text = note.text || '';
        const matches = text.match(/#[\wа-яё]+/gi);
        if (matches) matches.forEach(tag => tagsSet.add(tag));
      });
      return Array.from(tagsSet);
    }

    function renderTags() {
      const tagsContainer = document.getElementById('tagsContainer');
      const tags = getAllTags();
      const on = 'bg-purple-600 text-white';
      const off = 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800';

      // "Все" и ⭐ всегда стоят первыми, дальше — обычные теги
      let html = `<button onclick="filterByTag(null)" class="px-3 py-1 rounded-full shrink-0 font-medium transition ${selectedTag === null ? on : off}">Все</button>`;
      html += `<button onclick="filterByTag('${FAV_TAG}')" title="Избранное" class="px-3 py-1 rounded-full shrink-0 font-medium transition ${selectedTag === FAV_TAG ? on : off}">⭐</button>`;

      tags.forEach(tag => {
        html += `<button onclick="filterByTag('${tag}')" class="px-3 py-1 rounded-full shrink-0 font-medium transition ${selectedTag === tag ? on : off}">${tag}</button>`;
      });

      tagsContainer.innerHTML = html;
    }

    function filterByTag(tag) {
      selectedTag = tag;
      renderTags();
      renderNotes();
    }

    function toggleDay(dateStr) {
      openDays[dateStr] = !openDays[dateStr];
      renderNotes();
    }

    function insertMarkdown(startTag, endTag) {
      const textarea = document.getElementById('modalText');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;

      textarea.value = text.substring(0, start) + startTag + text.substring(start, end) + endTag + text.substring(end);
      textarea.focus();
      textarea.setSelectionRange(start + startTag.length, end + startTag.length);
      handleTextDraftInput();
    }

    // ---------- Эмодзи (необязательно, повторный клик снимает выбор) ----------
    function setEmoji(emoji) {
      selectedEmoji = (selectedEmoji === emoji) ? null : emoji;
      updateEmojiSelection();
    }

    function updateEmojiSelection() {
      document.querySelectorAll('.emoji-option').forEach(btn => {
        const active = !!selectedEmoji && btn.textContent.trim() === selectedEmoji;
        btn.classList.toggle('border', active);
        btn.classList.toggle('border-purple-500', active);
        btn.classList.toggle('bg-purple-950/50', active);
      });
    }

    // ---------- Фото: до 4 штук, до 40 МБ суммарно ----------
    // В колонке photo_url хранится либо одна ссылка (старые записи и бот),
    // либо JSON-массив [{url, size}] (несколько фото).
    function parsePhotos(raw) {
      if (!raw) return [];
      const str = String(raw).trim();
      if (str.startsWith('[')) {
        try {
          const arr = JSON.parse(str);
          return arr
            .map(i => typeof i === 'string' ? { url: i, size: 0 } : { url: i.url, size: i.size || 0 })
            .filter(i => i.url);
        } catch (e) { /* не JSON — считаем обычной ссылкой */ }
      }
      return [{ url: str, size: 0 }];
    }

    function serializePhotos(list) {
      if (!list.length) return null;
      return JSON.stringify(list.map(p => ({ url: p.url, size: p.size || 0 })));
    }

    function totalPhotoBytes() {
      return currentPhotos.reduce((sum, p) => sum + (p.size || 0), 0);
    }

    function formatMB(bytes) {
      return (bytes / 1048576).toFixed(1).replace('.', ',');
    }

    async function handleImageUpload(event) {
      await addPhotoFiles(event.target.files);
      event.target.value = '';
    }

    function handlePaste(event) {
      const items = (event.clipboardData || window.clipboardData).items;
      const files = [];
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          const f = item.getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length) {
        event.preventDefault();
        addPhotoFiles(files);
      }
    }

    async function addPhotoFiles(fileList) {
      const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/'));
      if (!files.length || isUploading) return;

      isUploading = true;
      renderModalImage();
      const problems = new Set();

      for (const file of files) {
        if (currentPhotos.length >= MAX_PHOTOS) {
          problems.add(`В одной записи может быть не больше ${MAX_PHOTOS} фото.`);
          break;
        }
        if (totalPhotoBytes() + file.size > MAX_TOTAL_BYTES) {
          problems.add(`Не поместилось в лимит ${MAX_TOTAL_BYTES / 1048576} МБ на запись (${formatMB(file.size)} МБ).`);
          continue;
        }

        let ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop() : (file.type.split('/')[1] || 'jpg');
        ext = ext.toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
        const filePath = `notes/web_uploads/web_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

        const { error } = await supabaseClient.storage
          .from('diary_photos')
          .upload(filePath, file, { contentType: file.type });

        if (error) {
          console.error(error);
          problems.add('Ошибка при загрузке фото.');
          continue;
        }

        const { data: publicUrlData } = supabaseClient.storage
          .from('diary_photos')
          .getPublicUrl(filePath);

        currentPhotos.push({ url: publicUrlData.publicUrl, size: file.size });
        renderModalImage();
      }

      isUploading = false;
      renderModalImage();
      if (problems.size) alert(Array.from(problems).join('\n'));
    }

    function renderModalImage() {
      const container = document.getElementById('modalImageContainer');
      const info = document.getElementById('photoInfo');
      const label = document.getElementById('photoLabel');
      const input = document.getElementById('photoFileInput');

      container.innerHTML = currentPhotos.length ? `
        <div class="grid grid-cols-4 gap-2 mb-1">
          ${currentPhotos.map((p, i) => `
            <div class="relative aspect-square">
              <img src="${p.url}" class="w-full h-full object-cover rounded-xl border border-slate-800">
              <button type="button" onclick="removePhoto(${i})" title="Убрать фото" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-slate-800 border border-slate-700 text-[10px] text-slate-300 hover:bg-red-900 hover:text-white flex items-center justify-center transition">✕</button>
            </div>
          `).join('')}
        </div>
      ` : '';

      if (isUploading) {
        info.textContent = 'Загрузка…';
      } else if (currentPhotos.length) {
        info.textContent = `${currentPhotos.length}/${MAX_PHOTOS} фото · ${formatMB(totalPhotoBytes())} / ${MAX_TOTAL_BYTES / 1048576} МБ`;
      } else {
        info.textContent = `до ${MAX_PHOTOS} фото, всего до ${MAX_TOTAL_BYTES / 1048576} МБ · Ctrl+V`;
      }

      const locked = isUploading || currentPhotos.length >= MAX_PHOTOS;
      input.disabled = locked;
      label.classList.toggle('opacity-50', locked);
      label.classList.toggle('pointer-events-none', locked);
    }

    function removePhoto(index) {
      currentPhotos.splice(index, 1);
      renderModalImage();
    }

    // ---------- Просмотр на весь экран ----------
    function openImageModal(noteId, index) {
      const note = allNotes.find(n => n.id === noteId);
      if (!note) return;
      const photos = parsePhotos(note.photo_url);
      if (!photos.length) return;

      const scroller = document.getElementById('viewerScroller');
      scroller.innerHTML = photos.map(p => `
        <div class="shrink-0 w-full h-full snap-center flex items-center justify-center p-4" onclick="if (event.target === this) closeImageModal()">
          <img src="${p.url}" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl border border-slate-800">
        </div>
      `).join('');

      document.getElementById('imageModal').classList.remove('hidden');
      scroller.scrollTo({ left: (index || 0) * scroller.clientWidth, behavior: 'auto' });
      onViewerScroll();
    }

    function onViewerScroll() {
      const scroller = document.getElementById('viewerScroller');
      const counter = document.getElementById('viewerCounter');
      const total = scroller.children.length;
      if (total < 2) { counter.classList.add('hidden'); return; }
      const idx = Math.round(scroller.scrollLeft / scroller.clientWidth);
      counter.textContent = `${Math.min(idx + 1, total)} / ${total}`;
      counter.classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.add('hidden');
      document.getElementById('viewerScroller').innerHTML = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeImageModal();
    });

    // ---------- Карусель фото в ленте ----------
    function renderPhotoCarousel(note) {
      const photos = parsePhotos(note.photo_url);
      if (!photos.length) return '';

      if (photos.length === 1) {
        return `
          <div class="my-2">
            <img src="${photos[0].url}" onclick="openImageModal(${note.id}, 0)" title="Нажмите, чтобы увеличить" class="rounded-xl max-h-80 w-auto max-w-full object-contain bg-slate-950 border border-slate-800 shadow-md cursor-pointer hover:opacity-90 transition">
          </div>
        `;
      }

      return `
        <div class="my-2 relative">
          <div class="carousel-scroll flex overflow-x-auto snap-x snap-mandatory overscroll-x-contain no-scrollbar rounded-xl border border-slate-800 bg-slate-950" onscroll="onCarouselScroll(this)">
            ${photos.map((p, i) => `
              <div class="shrink-0 w-full snap-center flex justify-center">
                <img src="${p.url}" loading="lazy" onclick="openImageModal(${note.id}, ${i})" class="max-h-80 w-auto max-w-full object-contain cursor-pointer">
              </div>
            `).join('')}
          </div>
          <span class="carousel-counter absolute top-2 right-2 text-[10px] bg-black/60 text-white px-2 py-0.5 rounded-full pointer-events-none">1 / ${photos.length}</span>
          <button onclick="scrollCarousel(this, -1)" class="hidden sm:flex absolute left-2 top-1/2 -translate-y-1/2 w-7 h-7 items-center justify-center rounded-full bg-black/50 hover:bg-black/70 text-white transition">‹</button>
          <button onclick="scrollCarousel(this, 1)" class="hidden sm:flex absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 items-center justify-center rounded-full bg-black/50 hover:bg-black/70 text-white transition">›</button>
        </div>
      `;
    }

    function onCarouselScroll(el) {
      const idx = Math.round(el.scrollLeft / el.clientWidth);
      const counter = el.parentElement.querySelector('.carousel-counter');
      if (counter) counter.textContent = `${Math.min(idx + 1, el.children.length)} / ${el.children.length}`;
    }

    function scrollCarousel(btn, dir) {
      const scroller = btn.parentElement.querySelector('.carousel-scroll');
      scroller.scrollBy({ left: dir * scroller.clientWidth, behavior: 'smooth' });
    }

    // ---------- Избранное ----------
    function favBtnClass(isFav) {
      return `text-lg leading-none px-1 transition ${isFav ? 'text-yellow-400' : 'text-slate-500 hover:text-yellow-300'}`;
    }

    function updateFavButtons(id) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      document.querySelectorAll(`[data-fav-id="${id}"]`).forEach(btn => {
        btn.textContent = note.is_favorite ? '★' : '☆';
        btn.className = favBtnClass(note.is_favorite);
        btn.title = note.is_favorite ? 'Убрать из избранного' : 'В избранное';
      });
    }

    async function toggleFavorite(id) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;

      const newValue = !note.is_favorite;
      note.is_favorite = newValue;
      updateFavButtons(id);

      const { error } = await supabaseClient
        .from('notes')
        .update({ is_favorite: newValue })
        .eq('id', id);

      if (error) {
        console.error(error);
        note.is_favorite = !newValue;
        updateFavButtons(id);
        alert('Не удалось обновить избранное. Проверьте, что в таблице notes есть колонка is_favorite.');
        return;
      }

      if (selectedTag === FAV_TAG) renderNotes();
    }

    // ---------- Лента ----------
    function renderNotes() {
      const container = document.getElementById('notesContainer');
      const groups = groupByDate(allNotes);
      let filteredGroups = {};

      Object.keys(groups).forEach(dateStr => {
        const notesInDay = groups[dateStr];
        const matchedNotes = notesInDay.filter(note => {
          const text = (note.text || '').toLowerCase();
          const matchesText = text.includes(searchQuery);
          const matchesDate = dateStr.toLowerCase().includes(searchQuery);
          const matchesTag =
            selectedTag === null ? true :
            selectedTag === FAV_TAG ? !!note.is_favorite :
            text.includes(selectedTag.toLowerCase());

          return (matchesText || matchesDate) && matchesTag;
        });

        if (matchedNotes.length > 0) {
          filteredGroups[dateStr] = matchedNotes;
        }
      });

      if (Object.keys(filteredGroups).length === 0) {
        container.innerHTML = (selectedTag === FAV_TAG && !searchQuery)
          ? '<p class="text-slate-500 text-center py-10">В избранном пока пусто. Нажмите ☆ у записи.</p>'
          : '<p class="text-slate-500 text-center py-10">Записей не найдено.</p>';
        return;
      }

      container.innerHTML = Object.keys(filteredGroups).map(date => {
        const isOpen = openDays[date] || false;
        const notesList = filteredGroups[date];
        const count = notesList.length;

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden transition">
            <button onclick="toggleDay('${date}')" class="w-full px-5 py-3 flex items-center justify-between bg-slate-900 hover:bg-slate-800/60 transition text-left">
              <div class="flex items-center space-x-3">
                <span class="text-xs text-purple-400 font-semibold uppercase tracking-wider">${date}</span>
                <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">${count} ${count === 1 ? 'запись' : count < 5 ? 'записи' : 'записей'}</span>
              </div>
              <span class="text-slate-400 text-sm transform transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}">▼</span>
            </button>

            <div class="${isOpen ? 'block' : 'hidden'} divide-y divide-slate-800/60 border-t border-slate-800/60">
              ${notesList.map(note => {
                const rawText = note.text || '';
                const renderedHtml = marked.parse(rawText);
                const time = new Date(note.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

                return `
                  <div class="px-5 py-4 space-y-3 hover:bg-slate-800/30 transition">
                    <div class="flex items-center justify-between">
                      <div class="flex items-center space-x-2">
                        ${note.emoji ? `<span class="text-base">${note.emoji}</span>` : ''}
                        <span class="text-xs text-slate-500">${time}</span>
                      </div>
                      <div class="flex items-center space-x-2">
                        <button data-fav-id="${note.id}" onclick="toggleFavorite(${note.id})" title="${note.is_favorite ? 'Убрать из избранного' : 'В избранное'}" class="${favBtnClass(note.is_favorite)}">${note.is_favorite ? '★' : '☆'}</button>
                        <button onclick="openEditModal(${note.id})" class="text-xs text-purple-400 hover:text-purple-300 bg-purple-950/40 px-2.5 py-1 rounded-lg border border-purple-900/40 transition">Редактировать</button>
                      </div>
                    </div>

                    ${renderPhotoCarousel(note)}

                    <div class="markdown-body text-sm text-slate-200">
                      ${renderedHtml || '<span class="text-slate-500 italic">Без текста</span>'}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // ---------- Календарь ----------
    function countWords(text) {
      const t = (text || '').trim();
      return t ? t.split(/\s+/).length : 0;
    }

    // Эмодзи дня — то, которое встречается чаще всего. При равенстве побеждает более свежее.
    function getTopEmoji(notes) {
      const counts = new Map(); // порядок вставки: от новых записей к старым
      notes.forEach(n => {
        if (n.emoji) counts.set(n.emoji, (counts.get(n.emoji) || 0) + 1);
      });
      let best = '';
      let bestCount = 0;
      counts.forEach((c, e) => {
        if (c > bestCount) { best = e; bestCount = c; }
      });
      return best;
    }

    function renderCalendar() {
      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth();

      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      document.getElementById('calMonthTitle').innerText = `${monthNames[month]} ${year}`;

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const totalDays = new Date(year, month + 1, 0).getDate();
      const groups = groupByDate(allNotes);

      let html = '';
      let monthWords = 0;

      for (let i = 0; i < firstDayIndex; i++) {
        html += `<div class="min-h-[3.5rem] bg-slate-950/40 rounded-xl opacity-20"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const checkDate = new Date(year, month, day);
        const dateStrRu = checkDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

        const notesOnThisDay = groups[dateStrRu] || [];
        const hasNotes = notesOnThisDay.length > 0;
        const dayWords = notesOnThisDay.reduce((sum, n) => sum + countWords(n.text), 0);
        monthWords += dayWords;
        const topEmoji = getTopEmoji(notesOnThisDay);

        html += `
          <div onclick="openDayFromCalendar('${dateStrRu}')" class="min-h-[3.5rem] py-1 bg-slate-950 border ${hasNotes ? 'border-purple-600/60 bg-purple-950/20 cursor-pointer hover:bg-purple-900/30' : 'border-slate-800/80'} rounded-xl flex flex-col items-center justify-center transition">
            <span class="text-xs leading-none ${hasNotes ? 'text-purple-300 font-bold' : 'text-slate-500'}">${day}</span>
            <span class="text-xs h-4 leading-4 mt-0.5">${topEmoji}</span>
            <span class="text-[9px] leading-none text-slate-400">${hasNotes ? dayWords : ''}</span>
          </div>
        `;
      }

      document.getElementById('calGrid').innerHTML = html;
      document.getElementById('calMonthWords').textContent = monthWords.toLocaleString('ru-RU');
    }

    function renderStats() {
      let totalWords = 0;
      let totalChars = 0;
      let totalNotesCount = allNotes.length;

      allNotes.forEach(note => {
        const text = note.text || '';
        totalChars += text.length;
        totalWords += text.trim() ? text.trim().split(/\s+/).length : 0;
      });

      const avgWords = totalNotesCount > 0 ? Math.round(totalWords / totalNotesCount) : 0;

      document.getElementById('statsContent').innerHTML = `
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-1">
          <span class="text-xs text-slate-400">Всего записей</span>
          <p class="text-2xl font-bold text-purple-400">${totalNotesCount}</p>
        </div>
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-1">
          <span class="text-xs text-slate-400">Всего слов в дневнике</span>
          <p class="text-2xl font-bold text-purple-400">${totalWords.toLocaleString('ru-RU')}</p>
        </div>
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-1">
          <span class="text-xs text-slate-400">Средне в 1 записи</span>
          <p class="text-2xl font-bold text-purple-400">${avgWords} слов</p>
        </div>
      `;
    }

    function changeMonth(direction) {
      calCurrentDate.setMonth(calCurrentDate.getMonth() + direction);
      renderCalendar();
    }

    function openDayFromCalendar(dateStr) {
      switchTab('feed');
      openDays[dateStr] = true;
      searchQuery = dateStr.toLowerCase();
      document.getElementById('searchInput').value = dateStr;
      renderNotes();
    }

    function updateCounters() {
      const text = document.getElementById('modalText').value;
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('charCount').innerText = `${chars} симв. / ${words} слов`;
    }

    function handleTextDraftInput() {
      updateCounters();
      if (currentEditingId === null) {
        localStorage.setItem('diary_draft', document.getElementById('modalText').value);
      }
    }

    function openCreateModal() {
      currentEditingId = null;
      currentPhotos = [];
      document.getElementById('modalTitle').innerText = 'Новая запись';
      const savedDraft = localStorage.getItem('diary_draft') || '';
      document.getElementById('modalText').value = savedDraft;
      renderModalImage();
      document.getElementById('deleteBtn').classList.add('hidden');
      selectedEmoji = null;
      updateEmojiSelection();
      updateCounters();
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }

    function openEditModal(id) {
      currentEditingId = id;
      const note = allNotes.find(n => n.id === id);
      if (!note) return;

      document.getElementById('modalTitle').innerText = 'Редактирование заметки';
      document.getElementById('modalText').value = note.text || '';
      selectedEmoji = note.emoji || null;
      updateEmojiSelection();
      currentPhotos = parsePhotos(note.photo_url);
      renderModalImage();
      document.getElementById('deleteBtn').classList.remove('hidden');
      updateCounters();
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').classList.remove('flex');
      currentEditingId = null;
      currentPhotos = [];
    }

    async function saveCurrentNote() {
      if (isUploading) {
        alert('Дождитесь окончания загрузки фото');
        return;
      }

      const text = document.getElementById('modalText').value.trim();
      if (!text && !currentPhotos.length) {
        alert('Заметка не может быть пустой');
        return;
      }

      const photoField = serializePhotos(currentPhotos);

      if (currentEditingId === null) {
        const { error } = await supabaseClient
          .from('notes')
          .insert([{ text: text, emoji: selectedEmoji, photo_url: photoField }]);

        if (!error) {
          localStorage.removeItem('diary_draft');
          closeModal();
          const todayStr = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
          openDays[todayStr] = true;
          await fetchNotes();
        } else {
          alert('Ошибка при создании записи');
          console.error(error);
        }
      } else {
        const { error } = await supabaseClient
          .from('notes')
          .update({ text: text, emoji: selectedEmoji, photo_url: photoField })
          .eq('id', currentEditingId);

        if (!error) {
          closeModal();
          await fetchNotes();
        } else {
          alert('Ошибка при сохранении');
        }
      }
    }

    async function deleteCurrentNote() {
      if (!confirm('⚠️ Внимание! Запись будет удалена безвозвратно. Вы абсолютно уверены?')) return;
      
      const { error } = await supabaseClient
        .from('notes')
        .delete()
        .eq('id', currentEditingId);

      if (!error) {
        closeModal();
        await fetchNotes();
      } else {
        alert('Ошибка при удалении');
      }
    }


    // ЛОГИКА СКРЫТИЯ ВЕРХНЕЙ ЧАСТИ ПРИ СКРОЛЛЕ (без смещения контента)
    const mainHeader = document.getElementById('mainHeader');
    const headerSpacer = document.getElementById('headerSpacer');
    const headerTop = document.getElementById('headerTop');
    const scrollThreshold = 60;
    const scrollDelta = 8;
    let headerHidden = false;
    let hideOffset = 0;
    let lastScrollTop = 0;

    function applyHeaderTransform() {
      mainHeader.style.transform = headerHidden ? `translateY(-${hideOffset}px)` : 'translateY(0)';
    }

    function measureHeader() {
      headerSpacer.style.height = mainHeader.offsetHeight + 'px';
      // высота верхней части + отступ space-y-3 (12) + padding-top шапки (16) - 8px воздуха над поиском
      hideOffset = headerTop.offsetHeight + 20;
      applyHeaderTransform();
    }

    measureHeader();
    new ResizeObserver(measureHeader).observe(mainHeader);
    window.addEventListener('resize', measureHeader);

    window.addEventListener('scroll', function() {
      const y = Math.max(0, window.pageYOffset || document.documentElement.scrollTop);
      const dy = y - lastScrollTop;

      if (y <= 0) {
        headerHidden = false;
      } else if (Math.abs(dy) < scrollDelta) {
        return; // мелкое движение — копим, не реагируем
      } else if (dy > 0 && y > scrollThreshold) {
        headerHidden = true;
      } else if (dy < 0) {
        headerHidden = false;
      }

      lastScrollTop = y;
      applyHeaderTransform();
    }, { passive: true });
  </script>
</body>
