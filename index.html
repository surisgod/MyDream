<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Дневник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Липкая шапка с поиском и тегами -->
  <header class="sticky top-0 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 z-30 py-4">
    <div class="max-w-3xl mx-auto px-4 space-y-3">
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-400">📖 Мой дневник</h1>
        <span id="userInfo" class="text-xs text-slate-400"></span>
      </div>

      <!-- Поиск -->
      <div class="flex gap-2">
        <input type="text" id="searchInput" placeholder="Поиск по записям..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
      </div>

      <!-- Панель тегов (генерируются автоматически из текста) -->
      <div id="tagsContainer" class="flex gap-2 overflow-x-auto pb-1 text-xs scrollbar-none">
        <button onclick="filterByTag(null)" class="tag-btn bg-indigo-600 text-white px-3 py-1 rounded-full shrink-0 font-medium transition">Все</button>
        <!-- Теги подгрузятся сюда сами -->
      </div>
    </div>
  </header>

  <div class="max-w-3xl mx-auto px-4 py-6">
    <main id="notesContainer" class="space-y-6">
      <p class="text-slate-500 text-center py-10">Загрузка записей...</p>
    </main>
  </div>

  <!-- Модальное окно редактирования -->
  <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-indigo-400">Редактирование заметки</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div id="modalImageContainer"></div>
      <textarea id="modalText" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
      <div class="flex justify-between">
        <button onclick="deleteCurrentNote()" class="px-4 py-2 bg-red-950/40 text-red-400 border border-red-900/50 rounded-xl text-xs hover:bg-red-900/40">Удалить</button>
        <div class="space-x-2">
          <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-xs rounded-xl hover:bg-slate-700">Отмена</button>
          <button onclick="saveCurrentNote()" class="px-4 py-2 bg-indigo-600 text-xs rounded-xl hover:bg-indigo-500 font-medium">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://oblwxfefeltikdkmodon.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bhvGHwhyHMBsG7amxcEw0g_fkWowvv6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MY_TELEGRAM_ID = 8499249541; 
    const BOT_USERNAME = 'OmoriDiarybot';

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let allNotes = [];
    let currentEditingId = null;
    let selectedTag = null;
    let searchQuery = '';

    // Авторизация
    const tgUser = tg.initDataUnsafe?.user;
    if (tgUser && tgUser.id) {
      initApp(tgUser);
    } else {
      const savedUser = JSON.parse(localStorage.getItem('tg_user') || 'null');
      if (savedUser) {
        initApp(savedUser);
      } else {
        renderLoginScreen();
      }
    }

    function renderLoginScreen() {
      document.querySelector('header').style.display = 'none';
      document.getElementById('notesContainer').innerHTML = `
        <div class="text-center py-16 space-y-4">
          <h2 class="text-lg font-medium text-slate-300">Авторизуйтесь для доступа к дневнику</h2>
          <div id="telegramLoginButton" class="flex justify-center pt-2"></div>
        </div>
      `;
      const script = document.createElement('script');
      script.async = true;
      script.src = "https://telegram.org/js/telegram-widget.js?22";
      script.setAttribute('data-telegram-login', BOT_USERNAME);
      script.setAttribute('data-size', 'large');
      script.setAttribute('data-onauth', 'onTelegramAuth(user)');
      document.getElementById('telegramLoginButton').appendChild(script);
    }

    window.onTelegramAuth = function(user) {
      localStorage.setItem('tg_user', JSON.stringify(user));
      location.reload();
    };

    async function initApp(user) {
      if (user.id !== MY_TELEGRAM_ID) {
        document.querySelector('header').style.display = 'none';
        document.getElementById('notesContainer').innerHTML = `<p class="text-red-400 text-center py-10">⛔ Доступ запрещен</p>`;
        return;
      }

      document.getElementById('userInfo').innerHTML = `👤 ${user.first_name || 'Владелец'}`;
      await fetchNotes();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderNotes();
      });
    }

    async function fetchNotes() {
      const { data, error } = await supabaseClient
        .from('notes')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }
      allNotes = data || [];
      renderTags();
      renderNotes();
    }

    // Автоматический сбор всех тегов из текста записей (например, слов начинающихся с #)
    function getAllTags() {
      const tagsSet = new Set();
      allNotes.forEach(note => {
        const text = note.text || '';
        const matches = text.match(/#[\wа-яё]+/gi);
        if (matches) {
          matches.forEach(tag => tagsSet.add(tag));
        }
      });
      return Array.from(tagsSet);
    }

    function renderTags() {
      const tagsContainer = document.getElementById('tagsContainer');
      const tags = getAllTags();

      let html = `<button onclick="filterByTag(null)" class="px-3 py-1 rounded-full shrink-0 font-medium transition ${selectedTag === null ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'}">Все</button>`;
      
      tags.forEach(tag => {
        const isActive = selectedTag === tag;
        html += `<button onclick="filterByTag('${tag}')" class="px-3 py-1 rounded-full shrink-0 font-medium transition ${isActive ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 border border-slate-800'}">${tag}</button>`;
      });

      tagsContainer.innerHTML = html;
    }

    function filterByTag(tag) {
      selectedTag = tag;
      renderTags();
      renderNotes();
    }

    function renderNotes() {
      const container = document.getElementById('notesContainer');

      // Фильтрация по поиску и выбранному тегу
      const filtered = allNotes.filter(note => {
        const text = (note.text || '').toLowerCase();
        const matchesSearch = text.includes(searchQuery);
        const matchesTag = selectedTag === null || text.includes(selectedTag.toLowerCase());
        return matchesSearch && matchesTag;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-center py-10">Записей не найдено.</p>';
        return;
      }

      // Группировка по дням
      const groups = {};
      filtered.forEach(note => {
        const dateStr = new Date(note.created_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        if (!groups[dateStr]) groups[dateStr] = [];
        groups[dateStr].push(note);
      });

      container.innerHTML = Object.keys(groups).map(date => `
        <div class="space-y-2">
          <h3 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider px-1">${date}</h3>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl divide-y divide-slate-800/60 overflow-hidden shadow-sm">
            ${groups[date].map(note => {
              const fullText = note.text || 'Без текста';
              const shortTitle = fullText.split('\n')[0].slice(0, 60) + (fullText.length > 60 ? '...' : '');
              const time = new Date(note.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

              return `
                <div onclick="openModal(${note.id})" class="p-4 flex items-center justify-between hover:bg-slate-800/40 cursor-pointer transition">
                  <div class="flex items-center space-x-3 overflow-hidden">
                    ${note.photo_url ? '<span class="text-xs bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded shrink-0">📷 фото</span>' : ''}
                    <p class="text-sm text-slate-200 truncate font-medium">${shortTitle}</p>
                  </div>
                  <span class="text-xs text-slate-500 shrink-0 ml-4">${time}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    // Модальное окно
    function openModal(id) {
      currentEditingId = id;
      const note = allNotes.find(n => n.id === id);
      if (!note) return;

      document.getElementById('modalText').value = note.text || '';
      document.getElementById('modalImageContainer').innerHTML = note.photo_url 
        ? `<img src="${note.photo_url}" class="rounded-xl max-h-48 w-full object-cover mb-3">` 
        : '';
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').classList.remove('flex');
      currentEditingId = null;
    }

    async function saveCurrentNote() {
      const newText = document.getElementById('modalText').value;
      const { error } = await supabaseClient
        .from('notes')
        .update({ text: newText })
        .eq('id', currentEditingId);

      if (!error) {
        closeModal();
        await fetchNotes();
      } else {
        alert('Ошибка при сохранении');
      }
    }

    async function deleteCurrentNote() {
      if (!confirm('Точно удалить эту запись?')) return;
      const { error } = await supabaseClient
        .from('notes')
        .delete()
        .eq('id', currentEditingId);

      if (!error) {
        closeModal();
        await fetchNotes();
      } else {
        alert('Ошибка при удалении');
      }
    }
  </script>
</body>
</html>
