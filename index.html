<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Дневник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div class="max-w-3xl mx-auto px-4 py-8">
    <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
      <h1 class="text-xl font-bold text-indigo-400">📖 Мой личный дневник</h1>
      <span id="userInfo" class="text-xs text-slate-400"></span>
    </header>

    <main id="notesContainer" class="space-y-4">
      <div id="loginContainer" class="text-center py-16 space-y-4">
        <h2 class="text-lg font-medium text-slate-300">Для доступа к дневнику необходима авторизация</h2>
        <p class="text-xs text-slate-500">Нажмите кнопку ниже, чтобы войти через свой аккаунт Telegram:</p>
        <!-- Сюда Telegram автоматически вставит кнопку входа -->
        <div id="telegramLoginButton" class="flex justify-center pt-2"></div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://oblwxfefeltikdkmodon.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bhvGHwhyHMBsG7amxcEw0g_fkWowvv6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ВАШ TELEGRAM ID для проверки
    const MY_TELEGRAM_ID = 8499249541; 
    const BOT_USERNAME = 'OmoriDiarybot'; // <-- Вставьте сюда юзернейм вашего бота (без @)

    // Проверяем, залогинен ли пользователь уже (храним сессию в браузере)
    const savedUser = JSON.parse(localStorage.getItem('tg_user') || 'null');

    if (savedUser) {
      checkAccessAndLoadNotes(savedUser);
    } else {
      renderLoginButton();
    }

    // Рисуем официальную кнопку Telegram Login
    function renderLoginButton() {
      const container = document.getElementById('telegramLoginButton');
      container.innerHTML = ''; // очищаем на всякий случай

      const script = document.createElement('script');
      script.async = true;
      script.src = "https://telegram.org/js/telegram-widget.js?22";
      script.setAttribute('data-telegram-login', BOT_USERNAME);
      script.setAttribute('data-size', 'large');
      script.setAttribute('data-onauth', 'onTelegramAuth(user)');
      script.setAttribute('data-request-access', 'write');

      container.appendChild(script);
    }

    // Эта функция срабатывает автоматически, когда вы успешно авторизуетесь через кнопку
    window.onTelegramAuth = function(user) {
      localStorage.setItem('tg_user', JSON.stringify(user));
      checkAccessAndLoadNotes(user);
    };

    async function checkAccessAndLoadNotes(user) {
      const container = document.getElementById('notesContainer');

      // Проверка: тот ли это ID
      if (user.id !== MY_TELEGRAM_ID) {
        container.innerHTML = `
          <div class="bg-red-950/30 border border-red-800 rounded-xl p-6 text-center">
            <h2 class="text-red-400 font-bold text-lg mb-2">⛔ Доступ запрещен</h2>
            <p class="text-slate-400 text-sm">Этот дневник принадлежит другому пользователю.</p>
            <button onclick="localStorage.removeItem('tg_user'); location.reload();" class="mt-4 px-4 py-2 bg-slate-800 text-xs rounded-lg hover:bg-slate-700">Войти под другим аккаунтом</button>
          </div>
        `;
        return;
      }

      document.getElementById('userInfo').innerHTML = `
        👤 ${user.first_name || 'Владелец'} 
        <button onclick="localStorage.removeItem('tg_user'); location.reload();" class="ml-3 text-red-400 hover:underline">Выйти</button>
      `;

      container.innerHTML = '<p class="text-slate-500 text-center py-10">Загрузка записей...</p>';

      // Загрузка записей из Supabase
      const { data, error } = await supabaseClient
        .from('notes')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = '<p class="text-red-400 text-center py-10">Ошибка загрузки данных из базы.</p>';
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-center py-10">В дневнике пока нет записей.</p>';
        return;
      }

      container.innerHTML = data.map(note => `
        <article class="bg-slate-900 border border-slate-800 rounded-xl p-4 transition hover:border-slate-700">
          <div class="text-xs text-slate-500 mb-2">${new Date(note.created_at).toLocaleString('ru-RU')}</div>
          ${note.photo_url ? `<img src="${note.photo_url}" class="rounded-lg mb-3 max-h-80 w-full object-cover">` : ''}
          <p class="text-slate-200 text-sm whitespace-pre-line">${note.text || ''}</p>
        </article>
      `).join('');
    }
  </script>
</body>
</html>
